plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace "com.thingclips.sdk.aistream"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0-alpha04'
    implementation "androidx.constraintlayout:constraintlayout:2.0.4"

    // AiAgentBusiness parses page payloads with fastjson.
    implementation 'com.alibaba:fastjson:1.1.67.android'

    // Audio stack required by the AI stream record/playback paths
    // (hold-to-talk, voice call, TTS). Declared here so the component is
    // self-contained instead of riding on the host's transitive deps.
    // 录音组件
    api 'com.thingclips.smart:thingsmart-audio-engine-sdk:7.5.3'
    api 'com.thingclips.smart:thingsmart-avlogger-sdk:7.5.3'
    // 音频编解码组件
    api 'com.thingclips.smart:thingsmart-mp3-codec-sdk:7.5.3'
    api 'com.thingclips.smart:thingsmart-opus-utils:6.7.2'

    implementation project(':base_res')
}
