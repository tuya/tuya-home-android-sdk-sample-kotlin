plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace "com.tuya.appsdk.sample.user"

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Match the app module's pin; otherwise this module resolves a p2p sdk
// version whose album plugin API differs.
configurations.all {
    exclude group: "com.thingclips.smart", module: 'thingsmart-modularCampAnno'
    resolutionStrategy.force 'com.thingclips.smart:thingsmart-p2p-file-trans-sdk:1.7.1'
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0-alpha04'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.constraintlayout:constraintlayout:2.0.4"

    implementation 'com.alibaba:fastjson:1.1.67.android'

    // Local-only jars (gitignored home/libs). The P2P album demo sources are
    // untracked WIP whose plugin artifacts are not on the public maven repos;
    // their classes.jar files are vendored locally for compile, and the same
    // jars sit in app/libs for runtime packaging.
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':base_res')
}